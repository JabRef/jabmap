name: Merge Dependabot PRs

# Runs after "check" instead of using GitHub's auto-merge: a merge made with GITHUB_TOKEN
# does not trigger the push workflow, so the Pages deploy has to be started explicitly.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge unless it is a major version bump
        run: |
          title=$(gh pr view "$PR" --json title --jq .title)
          if [[ $title =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] && [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then
            # --match-head-commit: never merge a commit pushed after the checked one
            gh pr merge "$PR" --squash --match-head-commit "$SHA"
            gh workflow run check.yml --ref main
          else
            echo "Major version bump, leaving \"$title\" for manual review"
          fi
